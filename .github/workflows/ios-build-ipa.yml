name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PROJECT_PATH: SimpleReminder.xcodeproj
      SCHEME: SimpleReminder
      CONFIGURATION: Release
      DERIVED_DATA_PATH: ${{ github.workspace }}/build/DerivedData
      APP_OUTPUT_DIR: ${{ github.workspace }}/build/Payload
      UNSIGNED_IPA_PATH: ${{ github.workspace }}/build/SimpleReminder-unsigned.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build unsigned app for iPhoneOS
        run: |
          set -euo pipefail
          rm -rf "$DERIVED_DATA_PATH"
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Pack unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$DERIVED_DATA_PATH/Build/Products/${CONFIGURATION}-iphoneos/SimpleReminder.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found at $APP_PATH"
            exit 1
          fi
          rm -rf "$APP_OUTPUT_DIR"
          mkdir -p "$APP_OUTPUT_DIR"
          cp -R "$APP_PATH" "$APP_OUTPUT_DIR/"
          rm -f "$UNSIGNED_IPA_PATH"
          (cd "$(dirname "$APP_OUTPUT_DIR")" && /usr/bin/zip -qry "$(basename "$UNSIGNED_IPA_PATH")" "Payload")

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: ios-ipa-unsigned
          path: build/SimpleReminder-unsigned.ipa
          if-no-files-found: error
